name: 'Klaus Antipatterns Search'
description: 'Detect code anti-patterns across multiple languages and upload results to GitHub Code Scanning'
author: 'Ka0s-Klaus'

branding:
  icon: 'search'
  color: 'purple'

inputs:
  path:
    description: 'Directory to scan (relative to repository root)'
    required: false
    default: '.'
  upload-sarif:
    description: 'Upload SARIF results to GitHub Code Scanning (requires security-events: write permission)'
    required: false
    default: 'true'
  sarif-output:
    description: 'Path for the SARIF output file'
    required: false
    default: 'antipatterns.sarif'
  comment-pr:
    description: 'Post a findings summary comment on pull requests (requires pull-requests: write permission)'
    required: false
    default: 'true'
  version:
    description: 'Release version to download (e.g. "1.2.0"). Defaults to the version matching the action ref, or "latest".'
    required: false
    default: 'latest'

outputs:
  findings-count:
    description: 'Total number of anti-pattern findings detected'
    value: ${{ steps.scan.outputs.findings-count }}

runs:
  using: 'composite'
  steps:
    - name: Download antipatterns binary
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "${ARCH}" in
          x86_64)        ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac

        ACTION_REF="${{ github.action_ref }}"
        INPUT_VERSION="${{ inputs.version }}"
        if [[ "${ACTION_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          VERSION="${ACTION_REF#v}"
        elif [ -n "${INPUT_VERSION}" ] && [ "${INPUT_VERSION}" != "latest" ]; then
          VERSION="${INPUT_VERSION}"
        else
          VERSION=$(curl -sSf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/Ka0s-Klaus/Klaus-antipatterns-search/releases/latest" \
            | jq -r '.tag_name | ltrimstr("v")')
        fi

        ARCHIVE="antipatterns_${VERSION}_${OS}_${ARCH}.tar.gz"
        BASE_URL="https://github.com/Ka0s-Klaus/Klaus-antipatterns-search/releases/download/v${VERSION}"

        curl -sSfL "${BASE_URL}/${ARCHIVE}" -o "${RUNNER_TEMP}/${ARCHIVE}"
        curl -sSfL "${BASE_URL}/antipatterns_${VERSION}_checksums.txt" \
          -o "${RUNNER_TEMP}/checksums.txt"

        cd "${RUNNER_TEMP}"
        grep "${ARCHIVE}" checksums.txt | sha256sum --check --status

        tar -xzf "${ARCHIVE}" -C "${RUNNER_TEMP}" antipatterns
        chmod +x "${RUNNER_TEMP}/antipatterns"
        echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

    - name: Run anti-pattern scan
      id: scan
      shell: bash
      run: |
        antipatterns scan "${{ inputs.path }}" \
          --format sarif \
          --output "${{ inputs.sarif-output }}"

        COUNT=$(jq '.runs[0].results | length' "${{ inputs.sarif-output }}")
        echo "findings-count=${COUNT}" >> "${GITHUB_OUTPUT}"

    - name: Upload SARIF to GitHub Code Scanning
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-output }}
        category: 'Klaus-antipatterns-search'

    - name: Comment findings summary on PR
      if: ${{ inputs.comment-pr == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        COUNT=$(jq '.runs[0].results | length' "${{ inputs.sarif-output }}")
        if [ "${COUNT}" -eq 0 ]; then
          BODY="## ✅ Klaus antipatterns-search\n\nNo anti-patterns detected in \`${{ inputs.path }}\`."
        else
          SUMMARY=$(antipatterns scan "${{ inputs.path }}" --format console 2>&1 | head -40)
          SECURITY_URL="${{ github.server_url }}/${{ github.repository }}/security/code-scanning"
          BODY="## 🔍 Klaus antipatterns-search — ${COUNT} finding(s)\n\n\`\`\`\n${SUMMARY}\n\`\`\`\n\nFull details in the [Security tab](${SECURITY_URL})."
        fi
        gh pr comment "${{ github.event.pull_request.number }}" \
          --body "$(printf "%b" "${BODY}")" \
          --repo "${{ github.repository }}"
